name: Check for new Obsidian release

on:
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest desktop version from changelog
        id: upstream
        run: |
          # Mobile and desktop share GitHub tags; only desktop publishes the
          # Linux tarball. Changelog URLs encode the platform, e.g.
          # https://obsidian.md/changelog/2026-08-12-desktop-v1.13.7/
          LATEST=$(curl -sL 'https://obsidian.md/changelog.json' | jq -r '
            [.items[]
             | (.url // .id) as $u
             | select($u | test("desktop-v"))
             | select(.title | test("Public"))
             | ($u | capture("desktop-v(?<v>[0-9.]+)") | .v)
            ] | first
          ')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::No public desktop release found in changelog.json"
            exit 1
          fi

          # Sanity-check the GitHub Linux tarball exists before bumping.
          ASSET="https://github.com/obsidianmd/obsidian-releases/releases/download/v${LATEST}/obsidian-${LATEST}.tar.gz"
          CODE=$(curl -sI -o /dev/null -w '%{http_code}' -L "$ASSET")
          if [ "$CODE" != "200" ]; then
            echo "::error::Desktop v${LATEST} has no Linux tarball (HTTP ${CODE}): ${ASSET}"
            exit 1
          fi

          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Selected desktop version: $LATEST"

      - name: Get current spec version
        id: current
        run: |
          CURRENT=$(grep '^Version:' obsidian.spec | awk '{print $2}')
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Update spec if new version available
        if: steps.upstream.outputs.version != steps.current.outputs.version
        env:
          NEW_VERSION: ${{ steps.upstream.outputs.version }}
          OLD_VERSION: ${{ steps.current.outputs.version }}
        run: |
          DATE=$(date +"%a %b %d %Y")
          sed -i "s/^Version:.*/Version:        ${NEW_VERSION}/" obsidian.spec
          sed -i "s/^Release:.*/Release:        1%{?dist}/" obsidian.spec
          # Prepend changelog entry
          sed -i "/^%changelog/a * ${DATE} github-actions <actions@github.com> - ${NEW_VERSION}-1\n- Update to ${NEW_VERSION}" obsidian.spec

      - name: Open and merge pull request
        if: steps.upstream.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${NEW_VERSION}"
          TITLE="build(spec): update to Obsidian ${NEW_VERSION}"
          BODY="Upstream published desktop v${NEW_VERSION} (https://obsidian.md/changelog/). This PR bumps the spec file."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add obsidian.spec
          git commit -m "$TITLE"
          git push -u --force origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            if ! PR_URL=$(gh pr create --title "$TITLE" --body "$BODY" --base main --head "$BRANCH"); then
              echo "::warning::Unable to create PR; pushing release commit directly to main."
              git checkout main
              git pull --ff-only origin main
              git merge --ff-only "$BRANCH"
              git push origin main
              git push origin --delete "$BRANCH" || true
              exit 0
            fi
          fi

          echo "Merging $PR_URL"
          gh pr merge "$PR_URL" --squash --delete-branch
